simulation:
  scene: assets/terrains/go2_recoveryrl_flat.xml
  control_dt: 0.02
  physics_dt: 0.002
  # The transferred actor runs at about 1.0 m/s in this MuJoCo model. Keep the
  # adaptation objective above that baseline so this is an acceleration task.
  source_velocity_reference: 1.0
  target_velocity: 1.2
  episode_steps: 500
  fall_angle_threshold: 0.8
  fall_min_base_height: 0.18
  fall_consecutive_physics_frames: 5
  joint_constraint_profile: fr_recovery
  policy_kp: 25.0
  policy_kd: 0.5
  effort_limit: 23.5
  max_target_rate: 12.0
  default_joint_position: [0.0, 0.9, -1.8, 0.0, 0.9, -1.8, 0.0, 0.9, -1.8, 0.0, 0.9, -1.8]
  action_scale: [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]

adaptation:
  seed: 3701
  device: cpu
  replay_capacity: 400000
  batch_size: 256
  warmup_collection_interactions: 10000
  reward_critic_warmup_updates: 1000
  adaptation_interactions: 200000
  risk_threshold: 0.2
  checkpoint_interval: 50000
  state_interval: 500

checkpoint_contract:
  source_task: safe
  policy_view: yaw_invariant_46d
  policy_observation_size: 46

